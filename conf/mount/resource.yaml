# 存储资源连接配置
# 本机开发连 react-base-mysql 容器（端口由仓库根 .env 的 MYSQL_HOST_PORT 固化；
# compose 内部署时容器网地址在 deploy/compose/conf/mount 单独配置）
mysql:
  llm:
    addr: '127.0.0.1:3317'
    connMaxLifeTime: 3600s
    connTimeOut: 1500ms
    database: llm
    maxIdleTime: 300s
    maxidleconns: 100
    maxopenconns: 100
    readTimeOut: 3s
    service: llm
    user: 'root'
    password: 'root'
    writeTimeOut: 3s

redis:
  demo:
    # react-base-redis 容器宿主机映射（docker-compose REDIS_HOST_PORT=16379）
    addr: '127.0.0.1:16379'
    connTimeOut: 1200ms
    idleTimeout: 5m
    maxActive: 100
    maxConnLifetime: 10m
    maxIdle: 100
    readTimeOut: 1200ms
    service: demo
    user: ''
    password: ''
    writeTimeOut: 1200ms

cos:
  # 对象存储走 docker compose 自部署 MinIO（S3 兼容）：
  #   docker compose up -d minio 后即用；bucket 首次访问自动创建。
  # provider: minio/s3=自部署 MinIO；local=本地目录（localDir）；留空=腾讯云 COS。
  # MinIO 模式下 secretID/secretKey 即 AccessKey/SecretKey（compose 默认 minioadmin/minioadmin），
  # endpoint 支持带 http(s):// 前缀，裸地址默认 HTTP；region 留空自动用 us-east-1。
  provider: 'minio'
  endpoint: 'http://127.0.0.1:9000'
  secretID: 'minioadmin'
  secretKey: 'minioadmin'
  bucket: 'react-base'
  appID: ''
  region: ''
  timeout: 30
  pathPrefix: 'react-base/llm'
  # 本地目录存储模式（无 MinIO 时的兜底，配置 localDir 即生效，优先级低于 provider）：
  # localDir: './data/cos'
