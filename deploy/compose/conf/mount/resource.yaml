# 存储资源连接配置（docker compose 内网地址版）
mysql:
  llm:
    addr: 'mysql:3306'
    connMaxLifeTime: 3600s
    connTimeOut: 1500ms
    database: llm
    maxIdleTime: 300s
    maxidleconns: 100
    maxopenconns: 100
    readTimeOut: 3s
    service: llm
    user: 'root'
    password: 'root'
    writeTimeOut: 3s

redis:
  demo:
    addr: 'redis:6379'
    connTimeOut: 1200ms
    idleTimeout: 5m
    maxActive: 100
    maxConnLifetime: 10m
    maxIdle: 100
    readTimeOut: 1200ms
    service: demo
    user: ''
    password: ''
    writeTimeOut: 1200ms

cos:
  # 对象存储走 compose 内自部署 MinIO（S3 兼容），容器内网地址 http://minio:9000；
  # bucket 首次访问自动创建。凭证对应 docker-compose.yml 里 MINIO_ROOT_USER/PASSWORD。
  provider: 'minio'
  endpoint: 'http://minio:9000'
  secretID: 'minioadmin'
  secretKey: 'minioadmin'
  bucket: 'react-base'
  appID: ''
  region: ''
  timeout: 30
  pathPrefix: 'react-base/llm'
