name: CI

on:
  push:
    # feature/* 分支推送同样触发 CI（长期功能分支保持构建可见）；合并回 main 后可从列表收敛。
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build / Vet / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

  sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/sdk/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:run

  integration:
    name: Integration tests (MySQL)
    # 环境依赖用例（//go:build integration）：需要真实 MySQL，默认跳过，手动触发。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: llm
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Init schema
        run: mysql -h 127.0.0.1 -P 3307 -uroot -proot < sql/init.sql

      - name: Integration tests
        run: go test -tags integration -count=1 ./router/... ./service/...
