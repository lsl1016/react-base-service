# 外部 API 连接配置
llm:
  # LLM 网关 API Key（按服务分组）；通过 /apikey 接口注册的 caller 级 key 优先。
  # 凭据安全：一律经环境变量注入（支持 ${VAR} 与 ${VAR:-默认值} 两种引用），仓库内不落明文 Key。
  # 本地开发需 export ZHIPU_API_KEY=<你的智谱 Key>；未设置时该端点不可用（报 api key not configured）。
  api_keys:
    default: "${ZHIPU_API_KEY}"
  endpoints:
    claude:
      api_url: "https://open.bigmodel.cn/api/anthropic"
      max_tokens: 32768
    deepseek:
      api_url: "https://api.deepseek.com/anthropic"
      max_tokens: 32768
    gpt:
      api_url: "https://openproxy.example.com/openproxy/rp"
      max_tokens: 32768
    gpt-cn:
      api_url: "https://openproxy-cn.example.com/openproxy/rp"
      max_tokens: 32768
    claude-cn:
      api_url: "https://openproxy-cn.example.com/openproxy/rp/pt/anthropic"
      max_tokens: 32768
    minimax:
      api_url: "https://openproxy-cn.example.com/openproxy/rp"
      max_tokens: 32768
    minimax-cn:
      api_url: "https://openproxy-cn.example.com/openproxy/rp"
      max_tokens: 32768

python_exec:
  # react-base-sandbox 容器宿主机映射（docker-compose SANDBOX_HOST_PORT=18190）
  domain: http://127.0.0.1:18190
  httpStat: false
  idleConnTimeout: 300s
  maxIdleConns: 100
  retry: 1
  service: python_exec
  timeout: 120s
