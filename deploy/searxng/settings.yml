# SearXNG 本地实例配置（web_search 工具的搜索后端）
# - 引擎收敛（TEST-REPORT-2026-10-27 D-4）：默认激活的 brave（限流）/duckduckgo（验证码）/
#   google cse（超时）/qwant（拒访问）在本网络不可用，聚合结果常年为空；显式停用，
#   改用对国内网络友好的引擎池：bing（cn 站点）+ baidu + sogou + 360search。
#   注：startpage 在本版本被上游标记 inactive（PoW 验证码），不可作为依赖项。
# - engines 条目按 name 更新默认引擎定义（实测 disabled/base_url 覆写均生效）；
#   keep_only 组合会丢引擎注册，勿用。
# - formats 加 json：作为 API 供 react-base-service 调用（默认只输出 html）
# - limiter 关闭：仅内网/本机使用，防 bot 限流会误拦 JSON API 调用
use_default_settings: true
server:
  secret_key: "22825183e1292fb531549bd9ffce8d56e432d79f8936325486695f15570c96f3"
  limiter: false
search:
  formats:
    - html
    - json
engines:
  # ── 启用：对当前网络实测友好的引擎 ──
  - name: bing
    disabled: false
    base_url: https://cn.bing.com
    weight: 1.3
  # baidu：实测持续不可用（反爬），不启用
  - name: baidu
    disabled: true
  - name: sogou
    disabled: false
  - name: 360search
    disabled: false
  # ── 停用：默认激活但本网络不可达 ──
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: qwant
    disabled: true
  - name: wikipedia
    disabled: true
