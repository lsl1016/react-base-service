<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1240" height="650" fill="#FFFFFF"/>

  <!-- ===== run 装配 ===== -->
  <rect x="30" y="60" width="260" height="250" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="160" y="90" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">run 装配</text>
  <g font-size="13" fill="#475569">
    <text x="48" y="124">· caller 校验 + 用户名解析</text>
    <text x="48" y="150">· 模型解析（modelHash / ApiKey）</text>
    <text x="48" y="176">· 系统提示词前缀匹配拼接</text>
    <text x="48" y="202">· 工具摘要索引快照</text>
    <text x="48" y="228">· Skill 索引摘要</text>
    <text x="48" y="254">· 长期记忆分层注入</text>
    <text x="48" y="280">· 单事务建 session / run</text>
  </g>
  <path d="M 290 150 H 314 V 112 H 386" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== ReAct 主循环 ===== -->
  <rect x="340" y="30" width="560" height="420" rx="16" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="620" y="60" font-size="17" font-weight="700" fill="#4C1D95" text-anchor="middle">ReAct 主循环（每轮 step）</text>

  <rect x="390" y="80" width="460" height="64" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="620" y="106" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">模型流式轮（模型互备）</text>
  <text x="620" y="130" font-size="13" fill="#64748B" text-anchor="middle">thought / content 流式事件 · 空闲超时检测</text>

  <line x1="620" y1="144" x2="620" y2="176" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <polygon points="620,184 680,240 620,296 560,240" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="620" y="246" font-size="15" font-weight="700" fill="#78350F" text-anchor="middle">tool call？</text>

  <line x1="620" y1="296" x2="620" y2="324" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="632" y="316" font-size="14" fill="#B45309" font-weight="700">是</text>

  <rect x="380" y="330" width="480" height="104" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="620" y="356" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">工具执行（同轮串行）</text>
  <text x="398" y="382" font-size="12.5" fill="#64748B">Meta Tool：get_tool / execute_tool / todo_write / memory_*</text>
  <text x="398" y="408" font-size="12.5" fill="#64748B">业务工具 HTTP · MCP ｜ Client 工具（HITL）｜ python_exec</text>

  <!-- 结果回填 -->
  <path d="M 380 398 H 372 V 112 H 386" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="254" font-size="13" fill="#64748B" text-anchor="middle" transform="rotate(-90 360 254)">结果回填</text>

  <!-- 否 → finish -->
  <line x1="680" y1="240" x2="956" y2="240" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="230" font-size="14" fill="#059669" font-weight="700">否</text>
  <rect x="960" y="200" width="250" height="80" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="976" y="230" font-size="16" font-weight="700" fill="#065F46">finish</text>
  <text x="976" y="256" font-size="13" fill="#047857">状态收敛 · done 事件</text>

  <!-- ===== 右侧注解卡片 ===== -->
  <g fill="#F8FAFC" stroke="#E2E8F0">
    <rect x="960" y="296" width="250" height="70" rx="10"/>
    <rect x="960" y="380" width="250" height="70" rx="10"/>
    <rect x="960" y="464" width="250" height="70" rx="10"/>
    <rect x="960" y="548" width="250" height="70" rx="10"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0F172A">
    <text x="976" y="322">上下文压缩</text>
    <text x="976" y="406">Steering 排队</text>
    <text x="976" y="490">delegate_agent</text>
    <text x="976" y="574">异步任务</text>
  </g>
  <g font-size="12.5" fill="#64748B">
    <text x="976" y="346">token 超水位 → LLM 语义摘要</text>
    <text x="976" y="430">运行中消息准入 · 结束自动续跑</text>
    <text x="976" y="514">子 ReactRun 委派 · 事件归流</text>
    <text x="976" y="598">&lt;async_tasks&gt; 注入 · resolve 闭环</text>
  </g>

  <!-- ===== 底部：持久化 ===== -->
  <line x1="620" y1="450" x2="620" y2="478" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="340" y="484" width="560" height="94" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="620" y="514" font-size="15" font-weight="700" fill="#78350F" text-anchor="middle">持久化与回放</text>
  <text x="620" y="540" font-size="12.5" fill="#92400E" text-anchor="middle">tblLlmReactRun / tblLlmReactMessage</text>
  <text x="620" y="562" font-size="12.5" fill="#92400E" text-anchor="middle">事件统一补 runId / sessionId / seq · 回放与实时协议同形</text>

  <!-- ===== 左下：WS 入口 ===== -->
  <rect x="30" y="484" width="260" height="94" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="160" y="514" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">WS 入口</text>
  <text x="160" y="540" font-size="12.5" fill="#64748B" text-anchor="middle">/react-base-service/react/ws</text>
  <text x="160" y="562" font-size="12.5" fill="#64748B" text-anchor="middle">run / cancel / tool_use_answer</text>
</svg>
