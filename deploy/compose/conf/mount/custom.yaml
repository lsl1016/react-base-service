# ReAct 基座服务业务配置（docker compose 版，与 conf/mount/custom.yaml 保持同步）
llm:
  models:
    claude:
      default_version: "glm-4.6"
      max_context_tokens: 1000000
    deepseek:
      versions: ["deepseek-flash", "deepseek-v4-pro"]
      default_version: "deepseek-flash"
      max_context_tokens: 1000000
    gpt:
      default_version: "glm-4.6"
      max_context_tokens: 1000000
  model_version_limits:
    "deepseek-v3":
      max_completion_tokens: 16384

  react:
    # create_plan（计划确认）能力开关；未配置默认 true。
    allow_plan: false
    # 请求未传 maxSteps 时的默认最大推理轮次。
    max_steps: 8
    # 单次模型流连续未收到 chunk 的最大秒数；超时后尝试互备模型。
    stream_idle_timeout_sec: 120
    # ReAct 前端可选模型。开启互备后失败会尝试列表中的其他模型。
    models:
      default:
        model_key: "claude"
        model_version: "glm-4.6"
        display_name: "GLM 4.6 (Anthropic 协议)"
      available:
        - model_key: "claude"
          model_version: "glm-4.6"
          display_name: "GLM 4.6 (Anthropic 协议)"
        - model_key: "deepseek"
          model_version: "deepseek-flash"
          display_name: "DeepSeek Flash (Anthropic 协议)"
        - model_key: "deepseek"
          model_version: "deepseek-v4-pro"
          display_name: "DeepSeek V4 Pro (Anthropic 协议)"
      mutual_failover: false
    # 历史上下文自动压缩：高水位触发、低水位目标。
    context_compact:
      enabled: true
      token_trigger: 170000
      token_target: 90000
      timeout_sec: 120
      summary_limit: 12000
      fallback_message_preview_limit: 2000
    # 工具结果回填：大结果落库并通过 resultRef 分片读取。
    tool_result:
      inline_limit_bytes: 262144
      preview_limit: 16384
      db_ttl_sec: 604800
      db_max_bytes: 16777216
      read_limit: 8192
      max_read_limit: 32768
    # playground 页面访问白名单；为空时不限制。
    playground_whitelist: []
    # 长期记忆（跨会话记忆）：表已在 react-base-mysql 建好；未配置默认关闭。
    memory:
      enabled: true
      resident_max_items: 16
      resident_budget_chars: 2000
      index_max_items: 64
      detached_max_items: 500
      allow_user_scope: true
      # 自动整理（reflection）：compact_end 后异步派生受限子 run；默认关闭，灰度开启。
      reflection:
        enabled: false
        cooldown_minutes: 60
        max_writes_per_run: 20
        transcript_char_limit: 16000
    # 子 Agent 委派（delegate_agent）：表已在 react-base-mysql 建好；未配置默认关闭。
    subagent:
      enabled: true
      max_parallel: 1        # 同一轮多个 delegate_agent 调用的并行上限（1=串行，需要稳定 HITL 保持 1）
      default_max_steps: 8   # agent 未配置 max_steps 时子 run 的步数上限
      max_depth: 2           # 委派嵌套深度上限（子 Agent 再委派），防递归失控
    # 时序事实图谱记忆（Graphiti，Layer2）：读写均走宿主机上的 Graphiti REST 服务。
    # group_id 由服务端按 caller(+user) 强制生成（不含连字符，FalkorDB 全文检索兼容）。
    graph_memory:
      enabled: true
      endpoint: 'http://host.docker.internal:8010'
      timeout_ms: 15000
      group_scope: caller_user
      inject:
        enabled: true
        max_facts: 8
        max_chars: 1200
        # Graphiti /search 实测 1.3~1.6s（含查询向量经网关嵌入），预算放宽到 4s；
        # 超时仍静默跳过注入，不影响 run 启动。
        timeout_ms: 4000
      write:
        enabled: true

async_task:
  # 异步任务状态同步框架总开关；无内置 Provider 时开启后也为空转
  enabled: false

mcp:
  caller_key: demo-app
  servers:
    # mcp-server 网关（容器进程经 Docker 内嵌 DNS 的 host.docker.internal 访问宿主机端口；
    # 与本机开发配置 conf/mount/custom.yaml 的 127.0.0.1 端点各写各的，工具同步进同一注册表）
    - name: mcpgw
      kind: http
      endpoint: 'http://host.docker.internal:18080/api/mcp'
      headers:
        Authorization: 'Bearer demo-app-key:demo-app-secret-please-rotate'
      timeout_ms: 30000
  allow_private_endpoint: true
