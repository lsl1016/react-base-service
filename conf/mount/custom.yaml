# ReAct 基座服务业务配置
llm:
  # 模型目录：每类模型的默认版本与上下文上限（供 LLM 客户端解析模型能力）
  models:
    claude:
      default_version: "glm-4.6"
      max_context_tokens: 1000000
      # GLM 的 Anthropic 兼容面支持 thinking 参数；显式声明后思考程度三态才会真正下发。
      supports_thinking: true
    deepseek:
      versions: ["deepseek-flash", "deepseek-v4-pro"]
      default_version: "deepseek-flash"
      max_context_tokens: 1000000
    gpt:
      default_version: "gpt-5.2"
      max_context_tokens: 1000000
  model_version_limits:
    "deepseek-v3":
      max_completion_tokens: 16384

  react:
    # create_plan（计划确认）能力开关；未配置默认 true。
    allow_plan: false
    # Steering（运行中引导/排队）：enabled 控制 guide 引导注入总开关（未配置默认 false）；
    # queue 控制不可引导时排队（S2，未配置默认 false）；queue_auto_drain 控制 run 正常结束后
    # 自动续跑队首（S2，未配置默认 true，仅 queue 开启时生效）。
    steering:
      enabled: true
      queue: true
      queue_auto_drain: true
    # 请求未传 maxSteps 时的默认最大推理轮次。maxSteps 只是防御性最后闸门：
    # 正常终止由软着陆/预算/超时等明确边界承担（见 docs/plan/20260925_AgentLoop终止边界与循环治理优化方案.md）。
    max_steps: 200
    # 单次模型流连续未收到 chunk 的最大秒数；超时后先同模型重试，预算耗尽再尝试互备模型。
    stream_idle_timeout_sec: 120
    # 主循环终止边界（0=不限）：
    loop:
      soft_landing_steps: 2          # 步数/预算临近耗尽时的收尾窗口轮数
      budget_tokens_per_run: 0       # 外层 run 递归 token 预算
      run_timeout_sec: 0             # 整 run wall-clock 上限（灰度建议先设 1800 观测）
      interaction_timeout_sec: 600   # ask_question/client tool/工具确认等待回包超时
      output_continuation_max: 2     # 输出被 max_tokens 截断时的自动续写上限
      anomaly_repeat_threshold: 3    # 同参数工具调用连续重复的提醒阈值
    # 模型调用同模型重试（预算耗尽后才切换互备模型）。
    model_retry:
      max_attempts: 3
      base_delay_ms: 1000
      max_delay_ms: 30000
    # 服务端工具执行运行时级默认（工具 config.timeout_ms 优先）。
    tool:
      default_timeout_ms: 60000
    # ReAct 前端可选模型。开启互备后失败会尝试列表中的其他模型。
    models:
      default:
        model_key: "claude"
        model_version: "glm-4.6"
        display_name: "GLM 4.6 (Anthropic 协议)"
      available:
        - model_key: "claude"
          model_version: "glm-4.6"
          display_name: "GLM 4.6 (Anthropic 协议)"
      mutual_failover: false
    # 历史上下文自动压缩：高水位触发、低水位目标。
    context_compact:
      enabled: true
      token_trigger: 170000
      token_target: 90000
      timeout_sec: 120
      summary_limit: 12000
      fallback_message_preview_limit: 2000
      output_reserve_tokens: 32768    # 有效窗口 = 模型目录 max_context_tokens - 输出预留 - buffer
      buffer_tokens: 13000
      microcompact_enabled: true      # 低压力微压缩：旧工具结果替换为 resultRef 占位
      microcompact_keep_recent: 5
      compact_failure_breaker: 3      # LLM 压缩连续失败熔断，熔断后直接走本地摘要
    # 工具结果回填：大结果落库并通过 resultRef 分片读取。
    tool_result:
      inline_limit_bytes: 262144
      preview_limit: 16384
      db_ttl_sec: 604800
      db_max_bytes: 16777216
      read_limit: 8192
      max_read_limit: 32768
    # playground 页面访问白名单；为空时不限制。
    playground_whitelist: []
    # 长期记忆（跨会话记忆）：开启前需先执行 sql/init.sql 中 tblLlmMemoryItem/tblLlmMemoryRevision 建表；
    # 未配置默认关闭（不注入、不注册记忆工具，行为与历史版本一致）。
    memory:
      enabled: true
      resident_max_items: 16        # 常驻层条数上限（单记忆空间）
      resident_budget_chars: 2000   # 常驻层注入字符预算
      index_max_items: 64           # 按需层目录索引注入条数上限
      detached_max_items: 500       # 按需层 active 条目软上限（超出拒绝新增）
      allow_user_scope: true        # false 时记忆收敛到 caller 维度（同 caller 用户共享）
      # 自动整理（reflection）：compact_end 后异步派生受限子 run 审阅被压缩对话并整理记忆；默认关闭。
      reflection:
        enabled: false
        cooldown_minutes: 60        # 同一 session 两次整理的最小间隔
        max_writes_per_run: 20      # 单次整理写操作上限（create/update/delete 合计）
        transcript_char_limit: 16000  # 注入给整理任务的被压缩原文转录字符上限
      # 自动沉淀（extractor，V2 Phase 2）：compact_end 后异步执行「LLM 抽取候选 → 预过滤 →
      # LLM 批量冲突消解 → 统一写核心落库」流水线；与 reflection 互斥，开启后 reflection 不再触发。
      extractor:
        enabled: false
        cooldown_minutes: 60        # 同一 session 两次沉淀的最小间隔
        max_candidates_per_run: 8   # 单次抽取候选上限
        max_writes_per_run: 10      # 单次沉淀落库写操作上限
        transcript_char_limit: 16000  # 注入给抽取任务的被压缩原文转录字符上限
        similar_top_k: 5            # 每个候选保留的相似存量条目上限
        min_confidence: 0.50        # 候选可信度阈值，低于直接丢弃
    # 服务端代码工作区（P2-1）：线上服务代码 → bare mirror 缓存 → 每 run git worktree，
    # 并动态挂载只读检索工具（ws_<service>_ 前缀）；未配置默认关闭。
    workspace:
      enabled: true
      root_dir: './data/workspaces'      # 每 run worktree 分配根目录
      mirror_dir: './data/repo-cache'    # bare mirror 单副本缓存（共享对象库）
      git_timeout_sec: 180               # 单次 git 子操作超时
      resolvers:                         # 静态服务解析白名单（真实链路后续接镜像中心）
        - service: react-base-service
          repo_url: '/Users/admin/Desktop/xm/react-base-service'  # 本地路径（开发自测；生产换 https/ssh）
          default_ref: main
          refs:
            prod: main
    # Agent Bundle 插件包安装（P3）：manifest + agents/ + skills/ + .mcp.json 打包，
    # POST /react/bundle/install 展开写入注册表（同名覆盖，可卸载回滚）；
    # 来源限白名单前缀（内部 git URL 或本地路径），空列表拒绝一切来源。
    bundle:
      enabled: true
      cache_dir: './data/bundle-cache'    # bundle 源仓库 bare mirror 缓存
      git_timeout_sec: 120                # 单次 git 子操作超时
      allowed_source_prefixes:            # 来源白名单（按前缀匹配）
        - 'C:/Users/keke/Desktop/xm/'     # 原作者本机（占位保留）；生产换内部 git 前缀
        - '/Users/admin/Desktop/xm/notebook/插件/'  # 本机插件目录（Bundle 安装目录选择器的浏览根）
    # 子 Agent 委派（delegate_agent）：开启前需先执行 sql/init.sql 中 tblLlmAgent 建表；
    # 未配置默认关闭（不注册 delegate_agent、不解析 agent 资源，行为与历史版本一致）。
    subagent:
      enabled: true
      max_parallel: 6        # 同一轮多个 delegate_agent 调用的并行上限（并行委派 + 泳道视图演示）
      default_max_steps: 100 # agent 未配置 max_steps 时子 run 的步数上限（运行时设置面板上限 64，改更大值须经此文件）
      max_depth: 2           # 委派嵌套深度上限（子 Agent 再委派），防递归失控

  # 定时触发工作流：按 cron 计划在服务端无人值守发起完整 ReAct run（见 docs/定时触发工作流实现方案.md）。
  # enabled=false 时不启动调度器、不注册管理接口（需先执行 sql/init.sql 中两张 workflow 表建表）。
  # 管理面板：/react-base-service/react/workflow/admin
  workflow:
    enabled: true
    # caller 级并发闸门：该 caller 在途 run 数达上限时本次触发记 skipped
    max_parallel_per_caller: 2
    # workflow 未显式配置时的超时/步数兜底
    default_timeout_sec: 1800
    default_max_steps: 20
    # completed 且无风险时是否免打扰（failed/timeout/high 风险恒通知）
    notify_only_on_risk: true
    # 回放页对外访问基址（通知拼接回放/报告链接用；空=通知只给 sessionId/artifactId）
    # replay_base_url: 'https://your-host'
    # 连环失败熔断：连续 N 次 failed/timeout 自动停用并通知；0=关闭
    failure_breaker_threshold: 3
    # 报告产物化：提示词要求把完整报告写成 markdown 并经 python_exec 落产物（通知带下载链接）
    report:
      prompt_enabled: true
    # 裁判外环：run 结束后语义判定目标是否达成（service/judge 独立组件，当前只接 workflow runner）；
    # 未达成自动追问续跑同一会话（上限 max_followup_rounds 轮）；判定故障自动降级为规则判级
    judge:
      enabled: true
      max_followup_rounds: 1
      transcript_chars: 24000

# MCP 客户端：kind=repo 走 stdio 适配器白名单（可执行文件部署于 bin/，env 注入子进程）；
# kind=http 走手写 Streamable HTTP；kind=http_sdk 走官方 MCP Go SDK（modelcontextprotocol/go-sdk）实现。
# HTTP 两种均无鉴权；endpoint 仅允许公网 http/https（拒绝环回/私网/保留地址）；
# 每次调用独立建会话，timeout_ms 默认 30000。
# caller_key 是 MCP 工具同步进注册表时挂载的调用方；留空或不配置 mcp 段则不启用。
mcp:
  caller_key: demo-app
  servers:
    - name: repo
      kind: repo
      env:
        # 代码检索镜像目录：要检索的外部项目 clone 到 data/repo-mirrors/（普通工作副本，
        # 非 bare mirror），检索工具只扫这里，不扫服务自身代码
        REPO_ROOT: '/Users/admin/Desktop/xm/react-base-service/data/repo-mirrors'
  # 本机开发环境放行环回/私网 MCP 端点（如 127.0.0.1 演示 MCP 服务）；生产环境必须删除此开关
  allow_private_endpoint: true
    # - name: remote
    #   kind: http_sdk            # 或 http（手写版）
    #   endpoint: 'https://mcp.example.com/mcp'
    #   timeout_ms: 30000

async_task:
  # 异步任务状态同步框架总开关；无内置 Provider 时开启后也为空转
  enabled: false

