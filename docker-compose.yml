# react-base-service 一键本地环境
#
# 使用：
#   1. 在 deploy/compose/conf/mount/api.yaml 填入 LLM API key
#   2. docker compose up -d --build
#   3. 访问 http://127.0.0.1:8080/react-base-service/react/playground
#
# 说明：
# - mysql/redis 使用本地已有镜像（mysql:8.0 / redis:7-alpine）；
# - sandbox 由 ./sandbox/Dockerfile 构建（基础镜像 python:3.11-slim，若本地缺失会触发一次拉取）；
# - MySQL 首次启动自动执行 sql/init.sql 建库；
# - 对象存储用自部署 MinIO（S3 兼容，替代腾讯云 COS），控制台 http://127.0.0.1:9001；
# - 服务配置挂载 deploy/compose/conf/mount（容器内网地址），与本机开发的 conf/mount 互不干扰；
# - 监控组件（prometheus/loki/promtail/grafana）配置见 deploy/monitoring，
#   采集全部走 compose 内网；Grafana 管理密码通过 GRAFANA_ADMIN_PASSWORD 覆盖（默认 admin）。
services:
  mysql:
    image: mysql:8.0
    container_name: react-base-mysql
    # 只在业务内网：沙箱不在本网，故不可达
    networks:
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: llm
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: react-base-redis
    # 只在业务内网：沙箱不在本网，故不可达
    networks:
      - backend
    # 宿主机端口映射供本地开发（go run）直连；容器内服务仍走内网 DNS redis:6379
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox:
    build:
      context: ./sandbox
    container_name: react-base-sandbox
    # P0-1 网络硬隔离：只挂 internal 网络（无出网路由），且仅 service 与它同网。
    # 沙箱因此既不可达外网、也不可达 mysql/redis；不再发布宿主机端口。
    # 本机 go run 需要直连的场景见 docker-compose.dev.yml（仅开发覆盖层，会放弃隔离）。
    networks:
      - sandbox-net
    # 强隔离：非 root + 只读根文件系统 + tmpfs 工作区 + 资源限额
    read_only: true
    tmpfs:
      - /tmp:rw,size=128m
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8190/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    container_name: react-base-searxng
    networks:
      - backend
    # 宿主机端口映射供本地开发（go run）的 web_search 调用；
    # 容器形态的 service 走内网 DNS http://searxng:8080（deploy/compose 配置）
    ports:
      - "${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ===== 对象存储：自部署 MinIO（S3 兼容），替代腾讯云 COS =====
  minio:
    image: minio/minio
    container_name: react-base-minio
    command: server /data --console-address ":9001"
    networks:
      - backend
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"   # S3 API（本机 go run 直连 127.0.0.1:9000）
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  service:
    build:
      context: .
    container_name: react-base-service
    # 唯一桥接两网的服务：业务内网（mysql/redis/minio/searxng）+ 沙箱隔离网
    networks:
      - backend
      - sandbox-net
    # MySQL 首次初始化存在 healthy 后短暂重启的窗口，连接失败自动重试自愈
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "${SERVICE_HOST_PORT:-8080}:8080"
    volumes:
      # 容器 WORKDIR 为 /usr/local/bin，配置按相对路径 conf/mount 读取
      - ./deploy/compose/conf/mount:/usr/local/bin/conf/mount:ro
      - service_logs:/usr/local/bin/log
      - service_data:/usr/local/bin/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ===== 监控（方案 A：Prometheus + Loki + Grafana，采集全程内网零公网流量）=====
  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: react-base-prometheus
    networks:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: react-base-loki
    networks:
      - backend
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    container_name: react-base-promtail
    networks:
      - backend
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - service_logs:/var/log/service:ro   # 复用业务服务日志卷
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: react-base-grafana
    networks:
      - backend
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

networks:
  # 业务内网：mysql/redis/minio/searxng/service 与监控组件互通，可出公网
  backend:
  # 沙箱隔离网（P0-1）：internal 断掉出网路由；只允许 service 与 sandbox 同网。
  # 静态扫描（AST 白名单）自此降级为"降噪第一层"，真正的边界由网络层承担。
  sandbox-net:
    internal: true

volumes:
  mysql_data:
  service_logs:
  service_data:
  prom_data:
  loki_data:
  grafana_data:
