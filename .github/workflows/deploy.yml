# 自动部署：push 到 main 后由 GitHub 官方 runner 打包代码、直传 ECS 解压构建。
# 依赖仓库 secret：ECS_SSH_KEY（部署专用私钥，公钥已装入 ECS authorized_keys）。
# 说明：
# - ECS 不再执行 git pull（国内直连 github.com 不稳定，443 经常超时），
#   改为 runner 侧 checkout 后 tar 打包、scp 直传，服务器全程不需要出网；
# - deploy/compose/conf/mount 不在打包范围内（服务器独有，含真实 key），
#   换目录部署时从旧目录整体搬迁，不会丢失；
# - 每次解压到全新目录再换名启用（旧目录在部署成功后删除），保证仓库里
#   已删除的文件真正从服务器下线（覆盖式解压曾导致残留 .go 与新代码重复声明、镜像构建失败）。
# 仅由 push/workflow_dispatch 触发，不响应 pull_request，避免公开仓库被恶意 PR 利用。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署任务，后来的 push 自动取消未完成的前序部署
concurrency:
  group: deploy-ecs
  cancel-in-progress: true

env:
  ECS_HOST: 118.31.6.254
  ECS_USER: root
  DEPLOY_DIR: /opt/react-base-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack & deploy
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$ECS_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 $ECS_USER@$ECS_HOST"

          tar -czf /tmp/src.tar.gz \
            --exclude=./.git \
            --exclude=./deploy/compose/conf/mount \
            .

          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            /tmp/src.tar.gz "$ECS_USER@$ECS_HOST:/tmp/src.tar.gz"

          # 全新目录解压后换名启用，保证删除的文件同步下线；服务器独有的
          # deploy/compose/conf/mount（真实 key，不进 tar 与镜像）从旧目录搬入新目录。
          $SSH "set -e
            NEW=/opt/react-base-service.incoming
            OLD=/opt/react-base-service.previous
            rm -rf \$NEW \$OLD
            mkdir -p \$NEW
            tar -xzf /tmp/src.tar.gz -C \$NEW
            rm -f /tmp/src.tar.gz
            if [ -d $DEPLOY_DIR/deploy/compose/conf/mount ]; then
              mkdir -p \$NEW/deploy/compose/conf
              cp -a $DEPLOY_DIR/deploy/compose/conf/mount \$NEW/deploy/compose/conf/mount
            fi
            if [ -d $DEPLOY_DIR ]; then mv $DEPLOY_DIR \$OLD; fi
            mv \$NEW $DEPLOY_DIR
            cd $DEPLOY_DIR
            docker compose up -d --build
            docker image prune -f
            rm -rf \$OLD"

          rm -f /tmp/deploy_key
